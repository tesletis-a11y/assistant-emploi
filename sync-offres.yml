name: Synchronisation quotidienne France Travail

on:
  schedule:
    # Tous les jours à 06:00 UTC (≈ 07:00 ou 08:00 heure française selon la saison)
    - cron: "0 6 * * *"
  workflow_dispatch: {}
    # Permet aussi de lancer la synchro à la main depuis l'onglet "Actions" de GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Interroger l'API France Travail
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
        run: node scripts/fetch-offres.js

      - name: Publier offres.json si des changements existent
        run: |
          git config user.name "Assistant Emploi Bot"
          git config user.email "actions@users.noreply.github.com"
          git add offres.json
          git diff --staged --quiet || git commit -m "Synchronisation automatique des offres ($(date -u +%Y-%m-%d))"
          git push
