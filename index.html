<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon Assistant Emploi — V1</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#202331;--muted:#6d7280;--accent:#5b4bdb;--green:#1d8a5a;--orange:#c77b12;--red:#c74444;--blue:#3677c9;--border:#e5e7ef}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 22px;position:sticky;top:0;z-index:5}
.header{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800;font-size:20px}.brand span{color:var(--accent)}
button,.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:650;cursor:pointer;background:var(--accent);color:white}.secondary{background:#eef0f8;color:var(--text)}.danger{background:#fdecec;color:#a62e2e}.success{background:#eaf7f0;color:#146b46}
.layout{max-width:1200px;margin:auto;display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 68px)}
nav{padding:22px 12px;border-right:1px solid var(--border);background:#fafaff}nav button{display:block;width:100%;text-align:left;margin-bottom:7px;background:transparent;color:var(--text)}nav button.active,nav button:hover{background:#e9e7fb;color:var(--accent)}
main{padding:24px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(5,1fr)}.cards{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 2px 8px #20233108}.stat strong{font-size:27px;display:block}.muted{color:var(--muted);font-size:13px}.score{font-size:22px;font-weight:800;color:var(--accent)}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef0f8;margin:3px;font-size:12px}.tag.green{background:#eaf7f0;color:var(--green)}.tag.orange{background:#fff4df;color:#9a6008}.tag.red{background:#fdecec;color:#a62e2e}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.actions{margin-top:14px}.offer h3{margin:4px 0}.offer p{margin:7px 0}.section-title{margin:26px 0 12px}input,textarea,select{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;background:white;font:inherit}textarea{min-height:150px}.form{display:grid;gap:12px;max-width:760px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.empty{padding:30px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--border);border-radius:14px}
table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--border);font-size:14px}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modal>div{background:white;border-radius:18px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:22px}
@media(max-width:800px){.layout{display:block}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--border)}nav button{min-width:max-content;width:auto}.stats{grid-template-columns:1fr 1fr}main{padding:16px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="header"><div class="brand">Mon <span>Assistant Emploi</span></div><button onclick="openAdd()">➕ Ajouter une offre</button></div></header>
<div class="layout">
<nav id="nav"></nav>
<main id="app"></main>
</div>
<div id="modal" class="hidden"></div>
<script>
const KEY='emploi_v1';
const defaultProfile={
 location:'Vinça', maxMinutes:45, idealMinutes:30, salaryFloorBrut:2200, followUpDays:10,
 families:[
  {name:'recouvrement / contentieux',keys:['recouvrement','contentieux','impay','débiteur','juridique','injonction','créance'],pts:30},
  {name:'gestion administrative',keys:['gestionnaire administratif','gestion administrative','gestionnaire de dossiers','prestations','administratif'],pts:25},
  {name:'banque / back-office',keys:['back-office','bancaire','banque','opérations bancaires','gestionnaire de comptes'],pts:22},
  {name:'organismes sociaux',keys:['caf','cpam','sécurité sociale','sécu recrute','urssaf','carsat'],pts:25},
  {name:'qse administratif',keys:['qse','qualité'],pts:10}
 ],
 avoid:['accueil','réception','standard','samedi','dimanche','week-end'],
 avoidTitle:['comptable'],
 preferredContracts:['CDD','Intérim'], fullTimePreferred:true, weekend:false,
 remoteBonus:true,
 priorities:['Recouvrement / contentieux','Gestion administrative','Banque / back-office','Organismes sociaux'],
 secondary:['QSE administratif'],
 exclusions:['Accueil / réception / standard','Conseil clientèle / vente','Community management / communication digitale','Travail le week-end'],
 bonus:['Dimension juridique / contentieux','Suivi des procédures','Analyse des comptes débiteurs','Back-office','Télétravail','Gestion de dossiers complexes']
};
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{offers:[],applications:[],profile:defaultProfile, page:'home'};
state.profile={...defaultProfile,...(state.profile||{})};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nav(){document.getElementById('nav').innerHTML=[
['home','🏠 Accueil'],['offers','🔎 Offres'],['saved','❤️ Suivies'],['apps','📋 Candidatures'+appsBadge()],['sources','⚙️ Sources'],['collector','🚀 Collecte'],['profile','👤 Mon profil']
].map(x=>`<button class="${state.page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(p){state.page=p;save();render()}
function hasWord(text,w){w=(w||'').trim().toLowerCase();if(!w)return false;return new RegExp('(^|[^a-zà-öø-ÿ0-9])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(text)}
function getFamilies(){return state.profile.families&&state.profile.families.length?state.profile.families:defaultProfile.families}
const fmtEuro=n=>Math.round(n).toLocaleString('fr-FR');
function floorBrut(){const f=+state.profile.salaryFloorBrut;return f>0?f:defaultProfile.salaryFloorBrut}
function salaryInfo(o){
 const mn=+o.salaryMinBrut||0,mx=+o.salaryMaxBrut||mn;
 if(mn||mx){const lo=mn||mx;return{kind:'brut',max:mx,text:(mx>lo?fmtEuro(lo)+' à '+fmtEuro(mx):fmtEuro(lo))+' € brut/mois'}}
 if(+o.salaryNet&&o.source!=='France Travail')return{kind:'net',max:+o.salaryNet,text:'~'+fmtEuro(o.salaryNet)+' € net/mois'}
 return null}
function salaryStatus(o){const si=salaryInfo(o);if(!si)return{status:'unknown'};const limit=si.kind==='net'?Math.round(floorBrut()*0.78):floorBrut();return{status:si.max>=limit?'ok':'low',text:si.text}}
function score(o){
 let s=50, reasons=[], cautions=[];
 const title=(o.title||'').toLowerCase(), desc=(o.description||'').toLowerCase();
 const text=title+' '+desc;
 let best={name:'Autre',pts:0};
 for(const f of getFamilies()){const hit=(f.keys||[]).some(k=>hasWord(text,k));if(hit&&f.pts>best.pts)best={name:f.name,pts:f.pts}}
 s+=best.pts; if(best.pts) reasons.push('Famille de métier recherchée : '+best.name);
 const avoidHit=(state.profile.avoid||[]).filter(w=>hasWord(text,w));
 if(avoidHit.length){s-=60;cautions.push('Mot à éviter détecté : '+avoidHit.slice(0,3).join(', '))}
 const avoidT=(state.profile.avoidTitle||[]).filter(w=>hasWord(title,w));
 if(avoidT.length){s-=40;cautions.push('Mot à éviter dans le titre : '+avoidT.slice(0,3).join(', '))}
 if(/télétravail|remote|hybride/.test(text)){s+=8;reasons.push('Télétravail ou mode hybride mentionné')}
 if(/contentieux|juridique|tribunal|avocat|injonction/.test(text)){s+=10;reasons.push('Dimension juridique/contentieuse')}
 if(/recouvrement|impay|débiteur|créance/.test(text)){s+=6;reasons.push('Recouvrement / comptes débiteurs')}
 if((o.contract||'').toLowerCase().includes('cdd')||(o.contract||'').toLowerCase().includes('intérim'))s+=5;
 // Le temps de trajet n'influence plus le score (l'estimation automatique
 // ne reflète pas la réalité des routes), mais un avertissement visuel
 // apparaît au-delà de 45 min pour que tu vérifies toi-même le trajet réel.
 if((o.minutes||0)>(state.profile.maxMinutes||45)){cautions.push(`Trajet estimé à ${o.minutes} min — à vérifier toi-même selon le type de route`)}
 const ss=salaryStatus(o);
 if(ss.status==='ok'){s+=8;reasons.push('Salaire annoncé au niveau de ton plancher ('+fmtEuro(floorBrut())+' € brut) ou au-dessus')}
 else if(ss.status==='low'){s-=15;cautions.push('Salaire annoncé ('+ss.text+') sous ton plancher de '+fmtEuro(floorBrut())+' € brut')}
 else cautions.push('Salaire non précisé — à vérifier');
 if((o.hours||'').toLowerCase().includes('temps partiel'))s-=2;
 s=Math.max(0,Math.min(100,Math.round(s)));
 return {s,reasons,cautions,category:best.name};
}
function badge(s){return s>=90?'🔥 Prioritaire':s>=75?'🟢 Intéressante':s>=60?'🟡 À examiner':'🔴 Faible adéquation'}
function offerCard(o){
 const a=score(o);
 const statusTag=o.status==='rejected'?'<span class="tag red">🚫 Écartée</span>':o.status==='saved'?'<span class="tag green">❤️ Suivie</span>':o.status==='applied'?'<span class="tag green">📝 Candidature envoyée</span>':'';
 return `<div class="card offer"><div class="row between"><span class="tag">${esc(o.source||'Ajout manuel')}</span><span class="score">${a.s}/100</span></div>
 <h3>${esc(o.title)}</h3><div class="muted">${esc(o.company||'Entreprise non précisée')} · ${esc(o.location||'Lieu non précisé')}</div>
 <p>${o.minutes?`🚗 ~${o.minutes} min (estimation)`:''}${o.distanceKm?` · 📍 ${o.distanceKm} km à vol d'oiseau`:''}${o.contract?` · 📄 ${esc(o.contract)}`:''}${` · 💰 ${esc((salaryInfo(o)||{}).text||'salaire non précisé')}`}${o.created?` · 🗓️ Publiée le ${esc(o.created)}`:''}</p>
 <span class="tag">${badge(a.s)}</span>${statusTag}${salaryStatus(o).status==='low'?'<span class="tag red">💰 Sous ton plancher</span>':''}${a.cautions.slice(0,2).map(x=>`<span class="tag orange">⚠️ ${esc(x)}</span>`).join('')}
 <div class="actions row"><button onclick="viewOffer('${o.id}')">Voir</button><button class="secondary" onclick="keepOffer('${o.id}')">❤️ Garder</button><button class="danger" onclick="rejectOffer('${o.id}')">Écarter</button></div></div>`
}

function sourceState(){return JSON.parse(localStorage.getItem('emploi_sources')||'null')||{'France Travail':{enabled:true,mode:'API officielle gratuite — synchronisée automatiquement chaque jour via GitHub Actions',status:'Connectée'},'Indeed':{enabled:false,mode:"Pas d'API publique ouverte pour ce type d'usage — ajout manuel uniquement",status:'Non disponible'},'HelloWork':{enabled:false,mode:"Pas d'API publique ouverte — ajout manuel uniquement",status:'Non disponible'},'LinkedIn':{enabled:false,mode:"Pas d'API publique ouverte — ajout manuel uniquement",status:'Non disponible'},'La Sécu recrute':{enabled:false,mode:'Pas de flux automatisé identifié — à surveiller manuellement pour le moment',status:'Manuel'}}}
function saveSources(s){localStorage.setItem('emploi_sources',JSON.stringify(s))}
function sourcePanel(){const s=sourceState();return `<h1>⚙️ Sources & synchronisation</h1><div class="card"><p><strong>Objectif :</strong> centraliser les nouvelles offres, supprimer les doublons et les faire passer dans ton moteur de scoring.</p><p class="muted">Les connexions externes devront utiliser les API, flux, alertes ou intégrations autorisés par chaque plateforme. Aucun mot de passe de plateforme n'est demandé.</p></div><div class="grid cards">${Object.entries(s).map(([n,v])=>`<div class="card"><div class="row between"><h3>${n}</h3><span class="tag ${v.status==='Prêt à surveiller'?'green':'orange'}">${v.status}</span></div><p class="muted">${v.mode}</p><label><input type="checkbox" ${v.enabled?'checked':''} onchange="toggleSource('${n}',this.checked)"> Surveiller cette source</label></div>`).join('')}</div><h2 class="section-title">🔄 Import de test</h2><div class="card"><p>Importe un JSON d'offres pour tester collecte, déduplication et scoring.</p><input type="file" accept=".json" onchange="importJson(event)"></div>`}
function toggleSource(n,on){const s=sourceState();s[n].enabled=on;saveSources(s);render()}
function importJson(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),a=Array.isArray(d)?d:(d.offers||[]);let n=0;a.forEach(x=>{const k=((x.title||'')+'|'+(x.company||'')+'|'+(x.location||'')).toLowerCase();if(!state.offers.some(o=>((o.title||'')+'|'+(o.company||'')+'|'+(o.location||'')).toLowerCase()===k)){state.offers.push({...x,id:crypto.randomUUID(),status:'new',source:x.source||'Import'});n++}});save();alert(n+' offre(s) ajoutée(s), doublons ignorés.');state.page='offers';render()}catch(err){alert('JSON invalide.')}};r.readAsText(f)}
function syncDemo(){const a=[{title:'Gestionnaire du recouvrement',company:'Organisme social — exemple',location:'Perpignan',minutes:28,contract:'CDD',salaryNet:1917,description:'Suivi des comptes débiteurs, recouvrement amiable et procédures contentieuses. Travail du lundi au vendredi.',source:'La Sécu recrute'},{title:'Gestionnaire administratif',company:'Exemple Banque',location:'Prades',minutes:12,contract:'Intérim',salaryNet:2050,description:'Gestion de dossiers, contrôle de pièces, back-office bancaire, suivi administratif et télétravail hybride.',source:'France Travail'},{title:'Assistant administratif accueil',company:'Entreprise exemple',location:'Perpignan',minutes:30,contract:'CDI',salaryNet:2100,description:'Accueil physique et téléphonique, standard, secrétariat.',source:'Indeed'}];let n=0;a.forEach(x=>{const k=(x.title+'|'+x.company+'|'+x.location).toLowerCase();if(!state.offers.some(o=>(o.title+'|'+o.company+'|'+o.location).toLowerCase()===k)){state.offers.push({...x,id:crypto.randomUUID(),status:'new'});n++}});save();alert(n+' offres de test ajoutées.');state.page='home';render()}


const defaultSearchCfg={communeInsee:'66230',distanceKm:70,typesContrat:['CDD','MIS','CDI'],profils:[
 {nom:'Recouvrement / contentieux',motsCles:'recouvrement'},{nom:'Contentieux / juridique',motsCles:'contentieux'},{nom:'Gestion administrative',motsCles:'gestionnaire administratif'},{nom:'Banque / back-office',motsCles:'back-office'},{nom:'Organismes sociaux (CAF, CPAM...)',motsCles:'gestionnaire prestations'},{nom:'Assistanat administratif',motsCles:'assistant administratif'},{nom:'Secrétariat',motsCles:'secrétaire'},{nom:'Agent administratif',motsCles:'agent administratif'}]};
let cfgDraft=JSON.parse(JSON.stringify(defaultSearchCfg)),cfgLoaded=false;
async function loadConfig(){try{const r=await fetch('./config.json',{cache:'no-store'});if(r.ok){const c=await r.json();cfgDraft={...defaultSearchCfg,...c};cfgLoaded=true}}catch(e){console.warn('config.json indisponible :',e.message)}if(state.page==='collector')render()}
function cfgClean(){return{communeInsee:String(cfgDraft.communeInsee||'').trim(),distanceKm:Number(cfgDraft.distanceKm),typesContrat:cfgDraft.typesContrat,profils:cfgDraft.profils.map(p=>({nom:(p.nom||'').trim(),motsCles:(p.motsCles||'').trim()}))}}
function cfgJson(){return JSON.stringify(cfgClean(),null,2)}
function cfgErrors(){const c=cfgClean(),e=[];if(!/^(\d{5}|2[AB]\d{3})$/i.test(c.communeInsee))e.push('Le code INSEE doit avoir 5 chiffres (Vinça : 66230).');if(!(c.distanceKm>0&&c.distanceKm<=200))e.push('Le rayon doit être compris entre 1 et 200 km.');if(!c.typesContrat.length)e.push('Coche au moins un type de contrat.');if(!c.profils.length)e.push('Ajoute au moins une recherche.');c.profils.forEach((p,i)=>{if(!p.nom||!p.motsCles)e.push('La recherche n°'+(i+1)+' doit avoir un nom et des mots-clés.')});return e}
function refreshCfgOut(){const el=document.getElementById('cfgOut');if(el)el.value=cfgJson()}
function setCfg(k,v){cfgDraft[k]=v;refreshCfgOut()}
function setProfil(i,k,v){cfgDraft.profils[i][k]=v;refreshCfgOut()}
function toggleContrat(c,on){const t=new Set(cfgDraft.typesContrat);on?t.add(c):t.delete(c);cfgDraft.typesContrat=['CDI','CDD','MIS'].filter(x=>t.has(x));refreshCfgOut()}
function addProfil(){cfgDraft.profils.push({nom:'',motsCles:''});render()}
function delProfil(i){cfgDraft.profils.splice(i,1);render()}
function resetCfg(){cfgDraft=JSON.parse(JSON.stringify(defaultSearchCfg));render()}
async function copyCfg(){const e=cfgErrors();if(e.length){alert('À corriger avant de copier :\n- '+e.join('\n- '));return}try{await navigator.clipboard.writeText(cfgJson());alert('Copié ✅\nOuvre maintenant config.json sur GitHub (bouton ci-dessous), sélectionne tout, colle, puis valide.')}catch(_){const el=document.getElementById('cfgOut');el.select();alert('Copie automatique impossible : le texte est sélectionné, copie-le (Ctrl+C, ou « Copier » sur téléphone).')}}
function ghUrl(){const h=location.hostname,p=location.pathname.split('/').filter(Boolean);if(!(h.endsWith('.github.io')&&p.length&&!p[0].includes('.')))return null;const base='https://github.com/'+h.split('.')[0]+'/'+p[0];return cfgLoaded?base+'/edit/main/config.json':base+'/new/main?filename=config.json'}
function repoBase(){const h=location.hostname,p=location.pathname.split('/').filter(Boolean);return h.endsWith('.github.io')&&p.length&&!p[0].includes('.')?'https://github.com/'+h.split('.')[0]+'/'+p[0]:null}
function syncBlock(){const a=state.lastSync?(Date.now()-new Date(state.lastSync).getTime())/36e5:null,rb=repoBase();
 const warn=a!==null&&a>30?`<p style="color:#b45309"><strong>⚠️ La dernière synchronisation date de ${Math.round(a)} h.</strong> Le passage automatique de GitHub a probablement été retardé ou sauté. Lance-la à la main avec le lien ci-dessous.</p>`:'';
 const link=rb?`<p class="muted"><a href="${rb}/actions/workflows/sync-offres.yml" target="_blank" rel="noopener">▶️ Ouvrir la page de synchronisation GitHub</a>, puis « Run workflow » (environ une minute, ensuite recharge cette page).</p>`:'';
 return warn+link}
function cfgView(){
 const c=cfgDraft,u=ghUrl(),L=state.lastConfig;
 const used=L?`Réglages appliqués lors de la dernière collecte : commune ${esc(String(L.communeInsee))}, rayon ${esc(String(L.distanceKm))} km, contrats ${esc((L.typesContrat||[]).join('/'))}, ${(L.profils||[]).length} recherche(s).`:'';
 return `<h2 class="section-title">🎯 Mes critères de recherche</h2>
 <div class="card"><p class="muted">Ces réglages décident quelles offres sont récupérées chaque jour sur France Travail. Modifie-les ici, puis applique-les avec les 3 étapes plus bas.</p>
 ${used?`<p class="muted">${used}</p>`:''}
 <div class="two"><label>Ville de référence (code INSEE)<input value="${esc(String(c.communeInsee))}" oninput="setCfg('communeInsee',this.value)"></label>
 <label>Rayon de recherche (km)<input type="number" min="1" max="200" value="${esc(String(c.distanceKm))}" oninput="setCfg('distanceKm',this.value)"></label></div>
 <p class="muted">Vinça = 66230. Pour une autre ville, cherche « code INSEE » suivi de son nom.</p>
 <h3>Types de contrat</h3><div class="row">${[['CDI','CDI'],['CDD','CDD'],['MIS','Intérim']].map(([k,l])=>`<label><input type="checkbox" ${c.typesContrat.includes(k)?'checked':''} onchange="toggleContrat('${k}',this.checked)"> ${l}</label>`).join('')}</div>
 <h3>Recherches (1 à 2 mots-clés chacune)</h3>
 <p class="muted">Plus il y a de mots dans une recherche, moins elle remonte d'offres (l'offre doit tous les contenir). Mieux vaut plusieurs recherches courtes qu'une longue.</p>
 ${c.profils.map((p,i)=>`<div class="row" style="margin-bottom:8px"><input style="flex:1;min-width:140px" placeholder="Nom" value="${esc(p.nom||'')}" oninput="setProfil(${i},'nom',this.value)"><input style="flex:1;min-width:140px" placeholder="Mots-clés" value="${esc(p.motsCles||'')}" oninput="setProfil(${i},'motsCles',this.value)"><button class="danger" onclick="delProfil(${i})">Supprimer</button></div>`).join('')}
 <div class="row"><button class="secondary" onclick="addProfil()">➕ Ajouter une recherche</button><button class="secondary" onclick="resetCfg()">↩️ Valeurs d'origine</button></div></div>
 <div class="card"><h3>📤 Appliquer ces critères</h3>
 <ol><li>Clique sur « Copier la configuration ».</li><li>Clique sur « Ouvrir config.json sur GitHub », sélectionne tout le texte, colle, puis clique sur « Commit changes ».</li><li>Attends environ une minute : la collecte se relance toute seule. Recharge ensuite cette page.</li></ol>
 <div class="row"><button onclick="copyCfg()">📋 Copier la configuration</button>${u?`<a class="btn" style="text-decoration:none;display:inline-block" href="${u}" target="_blank" rel="noopener">✏️ Ouvrir config.json sur GitHub</a>`:'<span class="muted">Ouvre le fichier config.json dans ton dépôt GitHub.</span>'}</div>
 <textarea id="cfgOut" readonly rows="10" style="margin-top:12px;font-family:monospace;font-size:12px">${esc(cfgJson())}</textarea></div>`}
function collector(){
 const s=sourceState();
 const sync=state.lastSync?`Dernière synchronisation : ${new Date(state.lastSync).toLocaleString('fr-FR')} — ${state.lastSyncCount||0} offre(s) reçue(s)`:"Aucune synchronisation reçue pour l'instant (vérifie que offres.json est bien généré).";
 return `<h1>🚀 Collecte automatique</h1>
 <div class="card"><h2>État du moteur</h2><p>${esc(sync)}</p>
 <div class="row"><span class="tag green">✓ Scoring</span><span class="tag green">✓ Déduplication</span><span class="tag green">✓ Profil</span><span class="tag ${s['France Travail'].enabled?'green':'orange'}">${s['France Travail'].enabled?'✓ France Travail branchée':'⏳ France Travail non branchée'}</span></div>
 <p class="muted">La recherche automatique s'exécute chaque jour côté serveur (GitHub Actions), pas dans ton navigateur : à chaque ouverture de l'appli, les nouvelles offres de France Travail sont déjà là. Voir le README fourni pour la mise en place.</p></div>
 ${cfgView()}
 <h2 class="section-title">📡 Sources</h2>

const APP_STATUS=['À préparer','Envoyée','Relancée','Réponse positive','Entretien programmé','Entretien passé','Offre reçue','Refusée','Clôturée sans réponse'];
const APP_ACTIVE=['Envoyée','Relancée'];
const APP_CLOSED=['Offre reçue','Refusée','Clôturée sans réponse'];
const APP_CHANNELS=['La Bonne Boîte','LinkedIn','Indeed','Jobijoba','France Travail',"Site de l'entreprise",'E-mail','Réseau / contact','Autre'];
let appEditing={id:null,draft:null};
const pad2=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
function todayISO(){return isoOf(new Date())}
function addDaysISO(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return isoOf(d)}
function diffDays(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
function fmtD(iso){return iso?new Date(iso+'T12:00:00').toLocaleDateString('fr-FR'):''}
function fmtDT(v){if(!v)return'';const [d,t]=v.split('T');return fmtD(d)+(t?' à '+t.replace(':','h'):'')}
function followDays(){const n=+state.profile.followUpDays;return n>0?n:10}
function blankApp(o={}){const t=todayISO();return{v:2,id:crypto.randomUUID(),offerId:'',title:'',company:'',type:'Offre',channel:'',status:'À préparer',created:t,sentDate:'',followUpDate:'',relances:0,response:'En attente',responseDate:'',interviewDate:'',interviewMode:'',interviewPlace:'',contact:'',notes:'',history:[{date:t,text:'Candidature ajoutée'}],...o}}
function migrateApp(a){
 if(a.v===2)return a;
 const m=(a.date||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/),created=m?m[3]+'-'+m[2]+'-'+m[1]:todayISO();
 const status=APP_STATUS.includes(a.status)?a.status:'À préparer';
 return blankApp({id:a.id||crypto.randomUUID(),offerId:a.offerId||'',title:a.title||'',company:a.company||'',type:a.offerId?'Offre':'Spontanée',status,created,history:[{date:created,text:'Candidature ajoutée'}]})
}
function normalizeApp(a,old){
 const log=t=>a.history.push({date:todayISO(),text:t});
 if(['Envoyée','Relancée'].includes(a.status)&&!a.sentDate)a.sentDate=todayISO();
 if(a.sentDate&&a.status==='À préparer')a.status='Envoyée';
 if(a.response==='Positive'&&APP_ACTIVE.includes(a.status))a.status='Réponse positive';
 if(a.interviewDate&&['À préparer','Envoyée','Relancée','Réponse positive'].includes(a.status))a.status='Entretien programmé';
 if(a.response==='Négative')a.status='Refusée';
 if(a.response!=='En attente'&&!a.responseDate)a.responseDate=todayISO();
 if(a.sentDate&&APP_ACTIVE.includes(a.status)&&a.response==='En attente'&&!a.followUpDate)a.followUpDate=addDaysISO(a.sentDate,followDays());
 if(old){
  if(old.status!==a.status)log('Statut : '+old.status+' → '+a.status);
  if(!old.sentDate&&a.sentDate)log('Candidature envoyée le '+fmtD(a.sentDate));
  if(old.response!==a.response)log('Réponse : '+(a.response==='En attente'?'pas de réponse':a.response==='Positive'?'positive':'négative'));
  if(a.interviewDate&&old.interviewDate!==a.interviewDate)log('Entretien prévu le '+fmtDT(a.interviewDate));
 }
}
function relanceInfo(a){if(!a.followUpDate||!APP_ACTIVE.includes(a.status)||a.response!=='En attente')return null;const d=diffDays(todayISO(),a.followUpDate);return{days:d,due:d<=0}}
function interviewInfo(a){if(!a.interviewDate||a.status!=='Entretien programmé')return null;return{days:diffDays(todayISO(),a.interviewDate.slice(0,10)),past:new Date(a.interviewDate)<new Date()}}
function todoItems(){
 const it=[];
 state.applications.forEach(a=>{
  const who=esc(a.title||'Candidature')+(a.company?' — '+esc(a.company):'');
  const r=relanceInfo(a);if(r&&r.due)it.push({k:0,text:'🔔 À relancer '+(r.days<0?'(en retard de '+(-r.days)+' j)':"aujourd'hui")+' : '+who});
  const i=interviewInfo(a);if(i&&!i.past&&i.days<=7)it.push({k:1,text:'🗓️ Entretien '+(i.days===0?"aujourd'hui":i.days===1?'demain':'dans '+i.days+' j')+' ('+fmtDT(a.interviewDate)+') : '+who});
  if(a.status==='À préparer')it.push({k:2,text:'📝 Candidature à envoyer : '+who});
 });
 return it.sort((x,y)=>x.k-y.k)
}
function appsBadge(){const n=todoItems().filter(x=>x.k<2).length;return n?' 🔔'+n:''}
function todoBlock(){const it=todoItems();if(!it.length)return'';return `<h2 class="section-title">📌 À faire</h2><div class="card">${it.slice(0,8).map(x=>`<p style="margin:6px 0">${x.text}</p>`).join('')}<div class="actions"><button onclick="go('apps')">Ouvrir mes candidatures</button></div></div>`}
function appRank(a){const r=relanceInfo(a),i=interviewInfo(a);if(r&&r.due)return 0;if(i&&!i.past)return 1;if(a.status==='À préparer')return 2;if(APP_CLOSED.includes(a.status))return 4;return 3}
function appFilterFn(f){return a=>f==='all'?true:f==='active'?!APP_CLOSED.includes(a.status):f==='relance'?!!(relanceInfo(a)&&relanceInfo(a).due):f==='interview'?['Entretien programmé','Entretien passé'].includes(a.status):f==='closed'?APP_CLOSED.includes(a.status):true}
function setAppFilter(v){state.appFilter=v;save();render()}
function appCard(a){
 const r=relanceInfo(a),iv=interviewInfo(a),off=state.offers.find(o=>o.id===a.offerId);
 const tone=a.status==='Offre reçue'||a.status==='Réponse positive'||a.status==='Entretien programmé'?'green':a.status==='Refusée'?'red':'';
 return `<div class="card offer"><div class="row"><span class="tag">${a.type==='Spontanée'?'Candidature spontanée':'Réponse à une offre'}</span>${a.channel?`<span class="tag">${esc(a.channel)}</span>`:''}</div>
 <h3>${esc(a.title||'Sans titre')}</h3><div class="muted">${esc(a.company||'')}</div>
 <p><span class="tag ${tone}">${esc(a.status)}</span>${a.response==='Positive'?'<span class="tag green">✅ Réponse positive</span>':a.response==='Négative'?'<span class="tag red">❌ Réponse négative</span>':''}</p>
 <p>${a.sentDate?'📤 Envoyée le '+fmtD(a.sentDate):'📤 Pas encore envoyée'}${a.responseDate&&a.response!=='En attente'?' · 📩 Réponse le '+fmtD(a.responseDate):''}</p>
 ${r?`<p style="${r.due?'color:#b45309':''}"><strong>🔔 Relance ${r.due?(r.days<0?'en retard de '+(-r.days)+' j':"à faire aujourd'hui"):'prévue le '+fmtD(a.followUpDate)+' (dans '+r.days+' j)'}</strong></p>`:''}
 ${a.status==='Relancée'&&a.relances>=2&&!a.followUpDate&&a.response==='En attente'?'<p class="muted">Aucune réponse après '+a.relances+' relances : tu peux clôturer cette candidature.</p>':''}
 ${a.interviewDate?`<p>🗓️ Entretien le <strong>${fmtDT(a.interviewDate)}</strong>${a.interviewMode?' · '+esc(a.interviewMode):''}${a.interviewPlace?' · '+esc(a.interviewPlace):''}${iv&&iv.past?' <span class="tag orange">⏰ passé : mets à jour le statut</span>':''}</p>`:''}
 ${a.contact?`<p class="muted">👤 ${esc(a.contact)}</p>`:''}${a.relances?`<p class="muted">Relances effectuées : ${a.relances}</p>`:''}${a.notes?`<p class="muted">${esc(a.notes)}</p>`:''}
 ${off&&off.url?`<p><a href="${esc(off.url)}" target="_blank" rel="noopener">🔗 Voir l'annonce</a></p>`:''}
 <div class="actions row"><button onclick="editApp('${a.id}')">✏️ Modifier</button>${r?`<button class="success" onclick="doRelance('${a.id}')">✅ J'ai relancé</button>`:''}${a.status==='À préparer'?`<button class="success" onclick="markSent('${a.id}')">📤 Marquer envoyée</button>`:''}${r?`<button class="secondary" onclick="downloadIcs('${a.id}','relance')">📅 Relance</button>`:''}${a.interviewDate?`<button class="secondary" onclick="downloadIcs('${a.id}','entretien')">📅 Entretien</button>`:''}</div></div>`
}
function apps(){
 const f=state.appFilter||'all',list=state.applications.filter(appFilterFn(f)).sort((x,y)=>appRank(x)-appRank(y)||((y.sentDate||y.created)>(x.sentDate||x.created)?1:-1));
 const due=state.applications.filter(a=>{const r=relanceInfo(a);return r&&r.due}).length;

 return `<div class="row between"><div><h1>📋 Mes candidatures</h1><p class="muted">${state.applications.length} candidature(s)${due?' · <strong style="color:#b45309">'+due+' à relancer</strong>':''}</p></div><button onclick="editApp()">➕ Ajouter une candidature</button></div>
 <div class="card"><div class="two"><select onchange="setAppFilter(this.value)">${o('all','Toutes')}${o('active','En cours')}${o('relance','À relancer')}${o('interview','Entretiens')}${o('closed','Terminées')}</select>
 <div class="row"><button class="secondary" onclick="exportData()">💾 Sauvegarder mes données</button><button class="secondary" onclick="document.getElementById('importFile').click()">📂 Restaurer</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></div></div>
 <p class="muted">Tes données sont enregistrées uniquement dans ce navigateur, sur cet appareil. Fais une sauvegarde de temps en temps, surtout avant de vider l'historique du navigateur ou de changer d'appareil.</p></div>
 <div class="grid cards" style="margin-top:16px">${list.map(appCard).join('')||'<div class="empty">Aucune candidature dans cette vue.</div>'}</div>`

function editApp(id){
 const a=id?state.applications.find(x=>x.id===id):blankApp();if(!a)return;
 appEditing={id:id||null,draft:id?null:a};
 const opt=(arr,v)=>arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
 const m=document.getElementById('modal');m.className='modal';
 m.innerHTML=`<div><div class="row between"><h2>${id?'✏️ Modifier la candidature':'➕ Ajouter une candidature'}</h2><button class="secondary" onclick="closeModal()">Fermer</button></div>
 <div class="two"><label>Poste<input id="aTitle" value="${esc(a.title)}"></label><label>Entreprise<input id="aCompany" value="${esc(a.company)}"></label>
 <label>Type<select id="aType"><option value="Offre" ${a.type==='Offre'?'selected':''}>Réponse à une offre</option><option value="Spontanée" ${a.type==='Spontanée'?'selected':''}>Candidature spontanée</option></select></label>
 <label>Canal<input id="aChannel" list="chanList" value="${esc(a.channel)}"><datalist id="chanList">${APP_CHANNELS.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label>
 <label>Statut<select id="aStatus">${opt(APP_STATUS,a.status)}</select></label>
 <label>Date d'envoi<input id="aSent" type="date" value="${esc(a.sentDate)}"></label>

 <label>Réponse<select id="aResp"><option value="En attente" ${a.response==='En attente'?'selected':''}>Pas de réponse pour l'instant</option><option value="Positive" ${a.response==='Positive'?'selected':''}>Réponse positive</option><option value="Négative" ${a.response==='Négative'?'selected':''}>Réponse négative</option></select></label>
 <label>Date de la réponse<input id="aRespDate" type="date" value="${esc(a.responseDate)}"></label>

 <label>Contact (nom, téléphone, e-mail)<input id="aContact" value="${esc(a.contact)}"></label></div>
 <label>Notes<textarea id="aNotes" rows="3">${esc(a.notes)}</textarea></label>

 ${id&&a.history&&a.history.length?`<h3>Historique</h3><div class="muted">${a.history.slice().reverse().map(h=>`<div>${fmtD(h.date)} — ${esc(h.text)}</div>`).join('')}</div>`:''}
 <div class="actions row"><button onclick="saveApp()">Enregistrer</button>${id?`<button class="danger" onclick="deleteApp('${id}')">Supprimer</button>`:''}</div></div>`

function saveApp(){
 const g=i=>document.getElementById(i).value;
 const title=g('aTitle').trim(),company=g('aCompany').trim();
 if(!title&&!company){alert("Indique au moins le poste ou l'entreprise.");return}
 let a,old=null;
 if(appEditing.id){a=state.applications.find(x=>x.id===appEditing.id);old=JSON.parse(JSON.stringify(a))}else a=appEditing.draft;
 Object.assign(a,{title,company,type:g('aType'),channel:g('aChannel').trim(),status:g('aStatus'),sentDate:g('aSent'),followUpDate:g('aFollow'),response:g('aResp'),responseDate:g('aRespDate'),interviewDate:g('aInt'),interviewMode:g('aMode'),interviewPlace:g('aPlace').trim(),contact:g('aContact').trim(),notes:g('aNotes').trim()});
 normalizeApp(a,old);
 if(!appEditing.id)state.applications.push(a);
 save();closeModal();render()
}
function deleteApp(id){if(!confirm('Supprimer définitivement cette candidature ?'))return;state.applications=state.applications.filter(x=>x.id!==id);save();closeModal();render()}
function markSent(id){const a=state.applications.find(x=>x.id===id);if(!a)return;const old=JSON.parse(JSON.stringify(a));a.sentDate=todayISO();a.status='Envoyée';normalizeApp(a,old);save();render()}
function doRelance(id){
 const a=state.applications.find(x=>x.id===id);if(!a)return;
 a.relances=(a.relances||0)+1;a.status='Relancée';
 a.history.push({date:todayISO(),text:'Relance n°'+a.relances+' effectuée'});
 a.followUpDate=a.relances>=2?'':addDaysISO(todayISO(),followDays());
 save();render()
}
const icsEsc=t=>String(t||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
const icsLocal=d=>d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'T'+pad2(d.getHours())+pad2(d.getMinutes())+'00';
function buildIcs(a,kind){
 const who=(a.title||'Poste')+(a.company?' — '+a.company:'');
 const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mon Assistant Emploi//FR','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+a.id+'-'+kind+'@assistant-emploi','DTSTAMP:'+stamp];
 if(kind==='entretien'){
  const s=new Date(a.interviewDate),e=new Date(s.getTime()+36e5);
  L.push('DTSTART:'+icsLocal(s),'DTEND:'+icsLocal(e),'SUMMARY:'+icsEsc('Entretien : '+who));
  if(a.interviewPlace)L.push('LOCATION:'+icsEsc(a.interviewPlace));
  L.push('DESCRIPTION:'+icsEsc([a.interviewMode,a.contact,a.notes].filter(Boolean).join('\n')),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Entretien','TRIGGER:-PT1H','END:VALARM');
 }else{
  const d=a.followUpDate.replace(/-/g,''),n=addDaysISO(a.followUpDate,1).replace(/-/g,'');
  L.push('DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+n,'SUMMARY:'+icsEsc('Relancer : '+who),'DESCRIPTION:'+icsEsc([a.contact,a.notes].filter(Boolean).join('\n')));
 }
 L.push('END:VEVENT','END:VCALENDAR');
 return L.join('\r\n')
}
function downloadFile(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const l=document.createElement('a');l.href=url;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadIcs(id,kind){
 const a=state.applications.find(x=>x.id===id);if(!a)return;
 if(kind==='entretien'&&!a.interviewDate)return;if(kind==='relance'&&!a.followUpDate)return;
 downloadFile((kind==='entretien'?'entretien':'relance')+'-'+(a.company||'candidature').replace(/[^\w-]+/g,'_')+'.ics',buildIcs(a,kind),'text/calendar;charset=utf-8')
}
function exportData(){downloadFile('assistant-emploi-sauvegarde-'+todayISO()+'.json',JSON.stringify(state,null,2),'application/json')}
function importData(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result);if(!Array.isArray(d.offers)||!Array.isArray(d.applications))throw new Error('ce n\'est pas une sauvegarde de l\'assistant');
  if(!confirm('Remplacer toutes les données actuelles (offres, candidatures, profil) par cette sauvegarde ?'))return;
  state=d;state.profile={...defaultProfile,...(state.profile||{})};state.applications=state.applications.map(migrateApp);save();render();alert('Sauvegarde restaurée ✅')
 }catch(e){alert('Fichier non valide : '+e.message)}};
 r.readAsText(f);inp.value=''
}
function profile(){
 const p=state.profile;
 return `<h1>👤 Mon profil</h1><div class="card"><h2>🎯 Critères actuels</h2><div class="two">
 <label>Ville de référence<input id="pLoc" value="${esc(p.location)}"></label>
 <label>Trajet maximum (minutes)<input id="pMax" type="number" value="${p.maxMinutes}"></label>
 <label>Trajet idéal (minutes)<input id="pIdeal" type="number" value="${p.idealMinutes}"></label>
 <label>Salaire plancher brut mensuel (€)<input id="pSal" type="number" value="${p.salaryFloorBrut}"></label>
 <label>Délai avant relance d'une candidature (jours)<input id="pFollow" type="number" min="1" value="${p.followUpDays||10}"></label></div>
 <p class="muted">Brut mensuel sur 12 mois, temps plein. Une offre dont le salaire annoncé est en dessous perd des points et est masquée par défaut ; si le salaire n'est pas précisé, elle reste visible avec un avertissement.</p>
 <h3>Priorités</h3><p>${p.priorities.map(x=>`<span class="tag green">${esc(x)}</span>`).join('')}</p>
 <h3>Mots-clés par famille de métier</h3><p class="muted">Sépare les mots par des virgules. Une offre qui contient l'un de ces mots (ou un mot qui commence ainsi) reçoit les points de la famille ; seule la meilleure famille compte.</p>
 ${getFamilies().map((f,i)=>`<label>${esc(f.name)} <span class="muted">(+${f.pts} points)</span><textarea id="fam${i}" rows="2">${esc((f.keys||[]).join(', '))}</textarea></label>`).join('')}
 <h3>Mots à éviter</h3>
 <label>Dans le titre ou l'annonce <span class="muted">(−60 points)</span><textarea id="pAvoid" rows="2">${esc((p.avoid||[]).join(', '))}</textarea></label>
 <label>Dans le titre uniquement <span class="muted">(−40 points)</span><textarea id="pAvoidT" rows="2">${esc((p.avoidTitle||[]).join(', '))}</textarea></label>
 <h3>Bonus importants</h3><p>${p.bonus.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</p>
 <div class="row" style="margin-top:12px"><button onclick="saveProfile()">Enregistrer les critères</button><button class="secondary" onclick="resetCriteria()">↩️ Valeurs d'origine</button></div></div>`;
}
const splitList=v=>(v||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
function saveProfile(){const p=state.profile;p.location=document.getElementById('pLoc').value;p.maxMinutes=+document.getElementById('pMax').value;p.idealMinutes=+document.getElementById('pIdeal').value;p.salaryFloorBrut=+document.getElementById('pSal').value||defaultProfile.salaryFloorBrut;p.followUpDays=+document.getElementById('pFollow').value||10;
 p.families=getFamilies().map((f,i)=>({...f,keys:splitList(document.getElementById('fam'+i).value)}));
 p.avoid=splitList(document.getElementById('pAvoid').value);p.avoidTitle=splitList(document.getElementById('pAvoidT').value);save();render();alert('Critères enregistrés ✅ Les scores sont recalculés.')}
function resetCriteria(){if(!confirm("Remettre les mots-clés, mots à éviter et le salaire plancher aux valeurs d'origine ?"))return;const p=state.profile;p.salaryFloorBrut=defaultProfile.salaryFloorBrut;p.families=JSON.parse(JSON.stringify(defaultProfile.families));p.avoid=[...defaultProfile.avoid];p.avoidTitle=[...defaultProfile.avoidTitle];save();render()}
function openAdd(){
 document.getElementById('modal').className='modal';
 document.getElementById('modal').innerHTML=`<div><div class="row between"><h2>➕ Ajouter une offre</h2><button class="secondary" onclick="closeModal()">Fermer</button></div>
 <div class="form"><label>Intitulé du poste<input id="oTitle" placeholder="Ex. Gestionnaire recouvrement"></label>
 <div class="two"><label>Entreprise<input id="oCompany"></label><label>Source<input id="oSource" value="Ajout manuel"></label></div>
 <div class="two"><label>Lieu<input id="oLoc" placeholder="Ex. Perpignan"></label><label>Temps de trajet (min)<input id="oMin" type="number" placeholder="Ex. 28"></label></div>
 <div class="two"><label>Contrat<input id="oContract" placeholder="CDD 12 mois"></label><label>Salaire net estimé (€)<input id="oSal" type="number" placeholder="Laisser vide si inconnu"></label></div>
 <label>Description / texte de l'annonce<textarea id="oDesc" placeholder="Colle ici l'annonce complète si tu veux que l'analyse soit plus précise."></textarea></label>
 <button onclick="addOffer()">Analyser et ajouter</button></div></div>`;
}
function closeModal(){document.getElementById('modal').className='hidden'}
function addOffer(){
 const o={id:crypto.randomUUID(),title:document.getElementById('oTitle').value||'Poste sans intitulé',company:document.getElementById('oCompany').value,source:document.getElementById('oSource').value,location:document.getElementById('oLoc').value,minutes:+document.getElementById('oMin').value||0,contract:document.getElementById('oContract').value,salaryNet:+document.getElementById('oSal').value||0,description:document.getElementById('oDesc').value,status:'new',created:new Date().toLocaleDateString('fr-FR')};
 state.offers.push(o);save();closeModal();state.page='offers';render();viewOffer(o.id)
}
function keepOffer(id){let o=state.offers.find(x=>x.id===id);if(o){o.status='saved';save();render()}}
function rejectOffer(id){let o=state.offers.find(x=>x.id===id);if(o){o.status='rejected';save();render()}}
function viewOffer(id){
 const o=state.offers.find(x=>x.id===id), a=score(o);
 document.getElementById('modal').className='modal';
 document.getElementById('modal').innerHTML=`<div><div class="row between"><h2>${esc(o.title)}</h2><button class="secondary" onclick="closeModal()">Fermer</button></div>
 <p class="muted">${esc(o.company)} · ${esc(o.location)} · Source : ${esc(o.source)}</p><div class="score">${a.s}/100 — ${badge(a.s)}</div>
 <h3>Conditions</h3><p>🚗 ${o.minutes||'?'} min · 📄 ${esc(o.contract||'Non précisé')} · 💰 ${esc((salaryInfo(o)||{}).text||'Salaire non précisé')}${o.salaryRaw?` <span class="muted">(annonce : ${esc(o.salaryRaw)})</span>`:''}</p>
 <h3>🤖 Pourquoi ?</h3><ul>${a.reasons.map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Correspondance à approfondir.</li>'}</ul>
 <h3>⚠️ Points de vigilance</h3><ul>${a.cautions.map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Aucun point bloquant détecté automatiquement.</li>'}</ul>
 <h3>Annonce</h3><p>${esc(o.description||'Aucun texte fourni.')}</p>
 ${o.url?`<p><a href="${esc(o.url)}" target="_blank" rel="noopener">🔗 Voir l'annonce originale sur France Travail</a></p>`:''}
 <div class="actions row"><button onclick="keepOffer('${o.id}');closeModal()">❤️ Garder</button><button class="success" onclick="apply('${o.id}');closeModal()">📝 Je veux postuler</button><button class="danger" onclick="rejectOffer('${o.id}');closeModal()">Écarter</button></div></div>`;
}
function apply(id){
 let o=state.offers.find(x=>x.id===id);if(!o)return;o.status='applied';
 if(!state.applications.some(x=>x.offerId===id))state.applications.push(blankApp({offerId:id,title:o.title,company:o.company,channel:o.source&&o.source!=='Ajout manuel'?o.source:''}));
 save();state.page='apps';render()
}
function assistant(){
 document.getElementById('modal').className='modal';document.getElementById('modal').innerHTML=`<div><div class="row between"><h2>🤖 Assistant</h2><button class="secondary" onclick="closeModal()">Fermer</button></div>
 <p>Je suis le prototype de ton assistant. Pour l'instant, je peux expliquer le classement des offres enregistrées.</p>
 <div class="card"><h3>Suggestion</h3><p>${state.offers.length?`Parmi tes ${state.offers.length} offre(s), commence par les offres notées <strong>${Math.max(...state.offers.map(o=>score(o).s))}/100</strong> et présentant une dimension recouvrement/contentieux.`:'Ajoute quelques offres pour commencer l’analyse.'}</p></div></div>`;
}
function render(){
 nav();const app=document.getElementById('app');
 app.innerHTML=state.page==='home'?home():state.page==='offers'?offers():state.page==='saved'?saved():state.page==='apps'?apps():state.page==='sources'?sourcePanel():state.page==='collector'?collector():profile();
 if(state.page==='offers')renderOffers();
}
async function loadAutoOffers(){
 try{
  const res=await fetch('./offres.json',{cache:'no-store'});
  if(!res.ok)return;
  const data=await res.json();
  if(!data||!Array.isArray(data.offres))return;
  let added=0;
  data.offres.forEach(x=>{
   const ex=state.offers.find(o=>o.externalId&&o.externalId===x.externalId);
   if(ex){ex.salaryMinBrut=x.salaryMinBrut;ex.salaryMaxBrut=x.salaryMaxBrut;ex.salaryRaw=x.salaryRaw;ex.salaryNet=0}
   else{
    state.offers.push({...x,id:crypto.randomUUID(),status:'new',created:x.created||new Date().toLocaleDateString('fr-FR')});
    added++;
   }
  });
  state.lastSync=data.generatedAt;
  state.lastSyncCount=data.count||data.offres.length;
  state.lastSyncNew=added;
  state.lastConfig=data.configUsed||null;
  save();
  render();
 }catch(e){
  // offres.json absent ou invalide (par ex. avant la première synchronisation) : silencieux, l'appli reste utilisable en ajout manuel.
  console.warn('Synchronisation automatique indisponible :',e.message);
 }
}
state.applications=(state.applications||[]).map(migrateApp);save();
render();
loadAutoOffers();
loadConfig();
</script>
</body></html>
