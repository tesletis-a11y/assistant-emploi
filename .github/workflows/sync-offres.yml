name: Synchronisation quotidienne France Travail

on:
  schedule:
    # Deux passages par jour, à des minutes "creuses" : GitHub retarde ou supprime
    # parfois les passages programmés, surtout pile à l'heure. Heures en UTC :
    # 05:23 = 06:23 ou 07:23 en France, 09:17 = 10:17 ou 11:17.
    - cron: "23 5 * * *"
    - cron: "17 9 * * *"
  # Se relance aussi toute seule quand tu modifies tes critères de recherche
  push:
    paths:
      - "config.json"
  # Permet aussi de lancer la synchro à la main depuis l'onglet "Actions" de GitHub
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Interroger l'API France Travail
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
        run: node scripts/fetch-offres.js

      - name: Publier offres.json si des changements existent
        run: |
          git config user.name "Assistant Emploi Bot"
          git config user.email "actions@users.noreply.github.com"
          git add offres.json
          git diff --staged --quiet || git commit -m "Synchronisation automatique des offres ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
